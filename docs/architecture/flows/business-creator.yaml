# Flow : Once Upon a Nerd — posts Buffer et leurs chiffres (ADR-54)
# Voir pipelines.yaml::creator_sync.

id: business-creator
label: "Once Upon a Nerd (posts Buffer + chiffres)"
domain: business
status: active

source_api:
  - name: "Buffer GraphQL API"
    detail: "posts (statut, dates, lien, métriques relues une fois par jour par Buffer) + channels (pages des chaînes)"
  - name: "Pages publiques TikTok / YouTube"
    detail: "Abonnés de la chaîne, lus dans la page (Buffer ne les donne pas). Instagram refuse sans connexion."

pipeline:
  id: creator_sync
  workflow: ".github/workflows/creator-sync.yml"
  script: "pipelines/creator_sync.py"
  cron: "0 6 * * *, 40 21 * * *"
  steps:
    - "Lit tous les posts Buffer (repli sur 31 jours si l'offre gratuite refuse le reste)"
    - "Retrouve l'épisode de chaque post : base, URL de la vidéo hébergée, post frère du même jour à New York"
    - "Upsert creator_episodes, creator_posts (posts disparus de Buffer → missing), creator_post_readings (un relevé par passage de Buffer)"
    - "Relit les compteurs publics des posts TikTok / YouTube des 14 derniers jours → creator_public_readings (ADR-55)"
    - "Lit les abonnés TikTok / YouTube → creator_audience (un relevé par jour de Paris)"

tables:
  - name: creator_episodes
    write: true
  - name: creator_posts
    write: true
  - name: creator_post_readings
    write: true
  - name: creator_public_readings
    write: true
  - name: creator_audience
    write: true

panels:
  - id: creator
    detail: "Onglet Once Upon a Nerd — vues tous réseaux et par réseau, vues gagnées par jour, démarrage des épisodes au même âge, tableau des épisodes dépliable, programmation et alertes"
