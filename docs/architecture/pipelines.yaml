    workflow_file: ".github/workflows/gaming-sync.yml"
    health:
      domain: veille_satellite
      panels: [gaming_news]
      table: gaming_articles
      date_column: fetch_date
      max_age_hours: 30
      remediation: >-
        Un flux RSS gaming est mort ou a changé d'URL : lire le log du run pour
        identifier lequel, puis corriger la liste des flux dans le script.
    script: "pipelines/gaming_sync.py"
    input_api: "RSS (JeuxVideo.com, Gamekult, IGN, Eurogamer, PC Gamer, Dexerto, GamesIndustry.biz…)"
