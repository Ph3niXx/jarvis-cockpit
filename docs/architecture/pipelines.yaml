# Catalogue des pipelines GitHub Actions (crons) — source de vérité de la
# timeline "Timeline crons" dans Jarvis Lab.
#
# Convention :
#   cron          : syntaxe GitHub Actions (UTC)
#   human_time    : formulation lisible ("quotidien 5h UTC", "toutes les 2h")
#   workflow_file : chemin relatif au repo (doit exister, vérifié par validate-arch)
#   script        : chemin du script Python lancé par le workflow
#   input_api     : API externe consommée (ou "none" pour les pipelines analyse pure)
#   output_tables : tables Supabase écrites (upsert ou insert) par le pipeline
#   read_tables   : tables Supabase lues (pour analyses)
#   avg_duration_s: durée moyenne d'un run en secondes (observationnel)
#   budget_usd    : coût moyen par run en USD (0 pour tier gratuit)
#   status        : active | paused | draft | archived
#                   `paused` = le workflow existe et reste lançable à la main, mais
#                   son cron a été retiré. Comme tout statut ≠ active, il sort du
#                   catalogue de surveillance : sa ligne est alors ÉLAGUÉE de la
#                   table pipeline_health au contrôle suivant (ADR-45), sans quoi
#                   elle resterait affichée « en panne » pour toujours.
#   health        : contrat de surveillance, consommé par pipelines/pipeline_health.py
#     domain          : section de l'onglet Santé. Vocabulaire FERMÉ de 7 valeurs
#                       (veille_ia, apprentissage, veille_satellite, mediatheque,
#                       perso, business, socle), imposé par validate-arch. Une
#                       brique sans domaine tomberait dans « Non classé ».
#     panels          : onglets du cockpit qui affichent la donnée de ce pipeline.
#                       Sert à savoir où poser le bandeau d'avertissement.
#     table           : table dont on mesure la fraîcheur.
#     date_column     : colonne de date/timestamp servant à mesurer l'âge.
#     max_age_hours   : au-delà, la donnée est déclarée `stale` même si les runs
#                       passent au vert — c'est ce qui attrape le no-op silencieux.
#     max_run_age_hours : (optionnel) âge maximal toléré pour le DERNIER run, quelle
#                       que soit sa conclusion. Au-delà → `stale`. Mesure le
#                       DÉCLENCHEMENT, là où les deux clés précédentes mesurent la
#                       SORTIE. C'est le seul signal possible pour un pipeline qui
#                       n'écrit aucune table : sans lui, un cron qui cesserait d'être
#                       déclenché resterait vert indéfiniment sur la foi d'un succès
#                       vieux de plusieurs mois (ADR-45).
#
#     `table` et `max_age_hours` se déclarent SÉPARÉMENT, ce qui donne trois cas :
#       table + max_age_hours  → fraîcheur mesurée ET sanctionnée. Pour les
#                                pipelines qui écrivent à chaque run quoi qu'il
#                                arrive (RSS, snapshots).
#       table sans max_age     → fraîcheur mesurée, JAMAIS sanctionnée. Pour les
#                                pipelines pilotés par l'activité de l'utilisateur
#                                (Strava, Withings, Last.fm, TFT) : ne rien écrire
#                                y est nominal — il n'a simplement pas couru. On
#                                mesure quand même, pour pouvoir dire « plus rien
#                                depuis 26 jours » au lieu d'un message muet.
#       ni l'un ni l'autre     → seul le verdict du run compte, et il faut alors
#                                déclarer `max_run_age_hours` sous peine de n'avoir
#                                AUCUN signal si le cron cesse d'être déclenché.
#
#     filter          : (optionnel) fragment de requête PostgREST appliqué à la
#                       sonde de fraîcheur — ex. `source=eq.anilist`. Nécessaire
#                       dès que la table de sortie a plusieurs écrivains, sinon
#                       la sonde d'un pipeline est satisfaite par les écritures
#                       d'un autre.
#     remediation     : (optionnel) le geste qui répare, une à deux phrases.
#                       Affiché tel quel sur l'onglet Santé. Absent = la ligne
#                       dégradée n'affiche pas de flèche, ce qui vaut mieux
#                       qu'un conseil creux.
#     impact          : (optionnel) la phrase d'effet, OBLIGATOIRE quand `panels`
#                       est vide. Ailleurs, l'effet se dérive des panels.

pipelines:
  - id: daily_digest
    name: "Veille IA quotidienne (Gemini)"
    cron: "0 6 * * *"
    human_time: "Tous les jours 06:00 UTC"
    workflow_file: ".github/workflows/daily_digest.yml"
    health:
      domain: veille_ia
      # Liste dérivée de l'intersection output_tables × panels[].reads de
      # dependencies.yaml, et non saisie à la main : elle n'annonçait que 3 onglets
      # (brief, updates, top) alors que les 5 tables de ce pipeline en alimentent 12.
      # Conséquence mesurée le 2026-08-21 : pendant les 4 jours de panne, 9 onglets
      # affichaient des données gelées sans le moindre avertissement.
      panels: [brief, updates, top, review, week, claude, search, wiki, signals, opps, stacks, history]
      table: articles
      date_column: fetch_date
      max_age_hours: 30
      remediation: >-
        Vérifier le quota Gemini (1000 req/jour, tier gratuit) sur
        aistudio.google.com, puis relancer le workflow daily_digest.
    script: "main.py"
    input_api: "RSS (flux veille IA) + Gemini 2.5 Flash-Lite"
    output_tables:
      - articles
      - daily_briefs
      - wiki_concepts
      - signal_tracking
      - gemini_api_calls
    read_tables:
      - user_profile
    avg_duration_s: 120
    budget_usd: 0
    status: active
    notes: >-
      Cron unique tous les jours 06:00 UTC. Retry Gemini ×4 avec fallback HTML si 503.
      Détection des flux RSS morts depuis le 2026-08-17 (ADR-38) : feedparser ne lève
      jamais sur un 404 ou une redirection HTML, on teste donc `status` et `entries`
      explicitement. Le cliquet entier MAX_DEAD_FEEDS a été remplacé le 2026-08-21
      (ADR-44) par un ensemble nommé KNOWN_DEAD_FEEDS + un plancher MIN_ARTICLES :
      `fetch_recent_articles()` ne lève plus jamais, et le run sort en code 1 APRÈS
      avoir tout écrit (articles, brief, concepts, signaux, email). Deux causes
      distinctes de rougeur : collecte sous MIN_ARTICLES, ou flux muet absent du socle
      — auquel cas le message le NOMME. Le socle se calibre UNIQUEMENT depuis les
      lignes [DEAD] d'un run réel sur le runner, jamais depuis une mesure locale : les
      17 flux réparés le 2026-08-21 l'ont été sur des URL vérifiées depuis une IP
      résidentielle, or certains CDN (Substack) répondent 200 ici et 403 au runner.

  - id: weekly_analysis
    name: "Analyses hebdo (Claude Haiku)"
    cron: "0 22 * * 0"
    human_time: "Dimanche 22:00 UTC"
    workflow_file: ".github/workflows/weekly_analysis.yml"
    health:
      domain: apprentissage
      panels: [recos, challenges, opps, signals]
      # On surveille learning_recommendations, PAS weekly_analysis : le run du
      # 2026-07-19 a écrit sa ligne de compte-rendu avec 0 token / 0 appel /
      # 0 recommandation. Surveiller la table de compte-rendu l'aurait donc
      # déclaré frais. C'est la sortie utile qu'il faut mesurer, pas la trace.
      table: learning_recommendations
      date_column: created_at
      max_age_hours: 192   # hebdo + 24 h de marge
      remediation: >-
        Recharger le crédit sur console.anthropic.com — un HTTP 400 « credit
        balance » est la panne historique de ce pipeline — puis relancer
        weekly_analysis.yml.
    script: "weekly_analysis.py"
    input_api: "Claude Haiku 4.5 (Anthropic API)"
    output_tables:
      - learning_recommendations
      - weekly_challenges
      - weekly_opportunities
      - wiki_concepts
      - signal_tracking
      - weekly_analysis
    read_tables:
      - articles
      - skill_radar
      - user_profile
    avg_duration_s: 420
    budget_usd: 0.03
    status: active
    notes: >-
      CostTracker hard-cap 1 $/run. 6 étapes : enrich_wiki, analyze_signals,
      generate_recommendations, generate_challenges, enrich_rte, analyze_opportunities.
      Depuis le 2026-08-17 (ADR-38) le run SORT EN CODE 1 s'il n'a passé aucun appel
      Claude réussi, et un refus définitif (401, 403, 400 « credit balance », 404 model)
      annule immédiatement les étapes restantes au lieu d'enchaîner 7 appels condamnés.
      Motif : entre le 2026-07-12 et le 2026-08-16, cinq runs consécutifs ont affiché
      un coche vert en ne produisant rien — solde de crédit Anthropic épuisé.

  - id: tft_sync
    name: "TFT matches (Riot API)"
    cron: ""                      # cron retiré le 2026-08-21 — voir notes
    human_time: "Manuel (workflow_dispatch)"
    workflow_file: ".github/workflows/tft-sync.yml"
    health:
      domain: perso
      panels: [gaming]
      # Mesurée mais pas sanctionnée : ne produit que si l'utilisateur joue.
      table: tft_matches
      date_column: played_at
      remediation: >-
        Obtenir une Personal API Key sur developer.riotgames.com (non expirante,
        validation manuelle) et la poser dans RIOT_API_KEY. Régénérer une clé de
        développement ne tient que 24 h et ne répare rien.
    script: "tft_pipeline.py"
    input_api: "Riot Games API (TFT)"
    output_tables:
      - tft_matches
      - tft_match_units
      - tft_match_traits
      - tft_match_lobby
      - tft_rank_history
    read_tables: []
    avg_duration_s: 45
    budget_usd: 0
    status: paused
    notes: >-
      Cron retiré le 2026-08-21. RIOT_API_KEY est une clé de DÉVELOPPEMENT que Riot
      invalide au bout de 24 h : sur 1 170 runs depuis le 2026-04-20, 9 seulement sont
      verts, et les 9 tiennent dans une fenêtre de 22 h 35 (2026-04-23 11:14 →
      2026-04-24 09:49 UTC) — soit exactement la durée de vie d'une clé. Ce workflow
      pesait ~88 % de tout l'historique rouge du dépôt et noyait les vraies pannes.
      Rotation de secret ≠ correctif : il faut une Personal API Key (non expirante,
      formulaire Riot avec validation manuelle), puis vérifier qu'un workflow_dispatch
      passe au vert PLUS DE 24 h après la pose, et seulement alors restaurer le cron
      `0 */2 * * *` et repasser status à active.

  - id: strava_sync
    name: "Strava activités"
    cron: ""                      # cron retiré le 2026-08-25 — voir notes
    human_time: "Manuel (workflow_dispatch)"
    workflow_file: ".github/workflows/strava-sync.yml"
    health:
      domain: perso
      panels: [perf]
      # Mesurée mais pas sanctionnée (pas de max_age_hours) : pas de sortie =
      # pas d'activité, pas une panne. Sert seulement à dater le bandeau.
      table: strava_activities
      date_column: start_date
      remediation: >-
        Souscrire un abonnement Strava, puis réactiver l'application sur
        strava.com/settings/api. Les trois secrets GitHub restent valides :
        le grant OAuth est intact, rejouer scripts/strava_oauth_init.py ne
        répare rien.
    script: "pipelines/strava_sync.py"
    input_api: "Strava API (OAuth2)"
    output_tables:
      - strava_activities
      - strava_activities_raw
      - user_profile
    read_tables:
      - user_profile
    avg_duration_s: 90
    budget_usd: 0
    status: paused
    notes: >-
      Cron retiré le 2026-08-25 (ADR-48). Les appels à l'API Strava sont devenus
      réservés aux abonnés payants : l'application est passée `Inactive` côté portail
      et tout appel `/api/v3/*` répond 403
      `resource: Application / field: Status / code: Inactive` depuis le 2026-07-01,
      soit 15 runs rouges d'affilée au 25/08. Ce n'est PAS un problème d'OAuth —
      `refresh_access_token()` renvoie toujours HTTP 200, Strava émet encore des
      access_tokens, le grant est intact et les trois secrets restent valides. Seul
      l'accès API a été retiré, hors du dépôt ; aucune ligne de code ne le rend.
      Écrit user_profile.strava_refresh_token après rotation OAuth (vérifié sain le
      2026-08-25 : `user_profile.key` est la PK, donc l'upsert PostgREST
      `merge-duplicates` vise la bonne cible, et la fonction lève au lieu de warner).
      Pour reprendre : abonnement, réactivation de l'app, `workflow_dispatch`, vérifier
      le vert — le lookback de 365 jours rattrape tout le trou en un seul run — puis
      restaurer le cron `30 4 * * *` et repasser status à active. Le script accepte
      `--days=N` en ligne de commande, mais le workflow n'expose AUCUN input
      `workflow_dispatch` (le catalogue l'a affirmé à tort jusqu'au 2026-08-25).

  - id: withings_sync
    name: "Withings composition corporelle"
    cron: "45 4 * * *"
    human_time: "Quotidien 04:45 UTC"
    workflow_file: ".github/workflows/withings-sync.yml"
    health:
      domain: perso
      panels: [perf]
      # Mesurée mais pas sanctionnée : pas de pesée = pas de donnée, pas une panne.
      table: withings_measurements
      date_column: measure_date
      remediation: >-
        Rejouer scripts/withings_oauth_init.py, poser le token dans le secret
        WITHINGS_REFRESH_TOKEN, puis lancer `gh workflow run withings-sync.yml
        -f backfill=true`. Le backfill n'est pas optionnel : un run normal ne
        demande que 7 jours et sauterait tout le trou (cf. docs/withings-setup.md).
    script: "pipelines/withings_sync.py"
    input_api: "Withings API (OAuth2)"
    output_tables:
      - withings_measurements
      - withings_measurements_raw
      - user_profile
    read_tables:
      - user_profile
    avg_duration_s: 30
    budget_usd: 0
    status: active
    notes: "Mode --backfill via workflow_dispatch pour réimporter depuis l'epoch. Écrit user_profile.withings_refresh_token après rotation OAuth — corrigé le 2026-07-26 : le token tourné était jusque-là jeté dans une variable `_new_refresh` au motif d'une « période de grâce » qui n'existe pas. Withings rotant à chaque appel et invalidant l'ancien immédiatement, le pipeline n'a réussi qu'une fois (2026-04-23) puis a échoué 3 mois sur invalid refresh_token. Le secret GitHub n'est valable que pour le premier run après (ré)autorisation ; ensuite la source de vérité est user_profile. ATTENTION — ce correctif est INERTE tant qu'un OAuth manuel n'a pas été rejoué : il ne s'arme qu'APRÈS un refresh réussi, or le seul token disponible est mort depuis le 2026-04-23. Séquence obligatoire : scripts/withings_oauth_init.py, poser le refresh_token dans le secret WITHINGS_REFRESH_TOKEN, puis déclencher le workflow À LA MAIN dans la foulée — le premier run consomme le secret et écrit user_profile.withings_refresh_token, après quoi la boucle s'auto-entretient. Depuis le 2026-08-21 le log distingue « aucun token en base » (repli nominal sur le secret) de « lecture Supabase refusée » (anomalie d'accès) : les deux rendaient None en silence. RE-VÉRIFIÉ LE 2026-08-25 (ADR-49) : toujours mort (`status=503 Invalid Params: invalid refresh_token`), et `user_profile` ne contient toujours AUCUNE clé `withings_refresh_token` — le correctif n'a jamais pu s'armer. Les cinq points où l'unique essai d'OAuth pouvait être gaspillé ont été audités et sont sains (persistance avant fetch, lève au lieu d'avertir, non court-circuitée par --dry-run, `key` est la PK, et le test de withings_oauth_init.py utilise l'access_token donc ne brûle pas le refresh). La doc de setup, elle, affirmait ENCORE la « période de grâce » inexistante qui a causé la panne — corrigée le 2026-08-25. INCREMENTAL_DAYS=7 impose un premier run en backfill, sans quoi le 2026-04-24 → 2026-08-18 est sauté définitivement."

  - id: lastfm_sync
    name: "Last.fm scrobbles (+ enrichissement lundi)"
    cron: "0 5 * * *"
    human_time: "Quotidien 05:00 UTC"
    workflow_file: ".github/workflows/lastfm-sync.yml"
    health:
      domain: perso
      panels: [music]
      # Mesurée mais pas sanctionnée : pas d'écoute = pas de scrobble, pas une panne.
      table: music_scrobbles
      date_column: scrobbled_at
      remediation: >-
        Vérifier la clé LASTFM_API_KEY dans les secrets GitHub
        (cf. docs/lastfm-setup.md).
    script: "pipelines/lastfm_sync.py"
    input_api: "Last.fm API + Gemini (enrich lundi)"
    output_tables:
      - music_scrobbles
      - music_scrobbles_raw
      - music_stats_daily
      - music_top_weekly
      - music_loved_tracks
      - music_artist_tags
      - music_genre_weekly
      - music_insights_weekly
    read_tables: []
    avg_duration_s: 60
    budget_usd: 0
    status: active
    notes: "Deuxième étape pipelines/lastfm_enrich.py déclenchée lundi ou via workflow_dispatch — tags artistes + répartition genres + insight Gemini."

  - id: steam_sync
    name: "Steam bibliothèque + stats"
    cron: "30 5 * * *"
    human_time: "Quotidien 05:30 UTC"
    workflow_file: ".github/workflows/steam-sync.yml"
    health:
      domain: perso
      panels: [gaming]
      table: steam_games_snapshot   # snapshot quotidien, écrit même sans jeu lancé
      date_column: snapshot_date
      max_age_hours: 30
      remediation: >-
        Vérifier la clé STEAM_API_KEY et que le profil Steam est resté public
        (cf. docs/steam-setup.md) — un profil repassé en privé casse l'API sans
        message clair.
    script: "pipelines/steam_sync.py"
    input_api: "Steam Web API + Steam Store API"
    output_tables:
      - steam_games_snapshot
      - gaming_stats_daily
      - steam_game_details
      - steam_achievements
    read_tables: []
    avg_duration_s: 180
    budget_usd: 0
    status: active
    notes: "Tourne avec --force pour bypasser la gate lundi des achievements. MAX_ENRICH_PER_RUN=20 sur Store API (catch-up lent)."

  - id: creator_sync
    name: "Once Upon a Nerd — posts Buffer et leurs chiffres"
    cron: "40 6,21 * * *"
    human_time: "Quotidien 06:40 et 21:40 UTC"
    workflow_file: ".github/workflows/creator-sync.yml"
    health:
      domain: business
      panels: [creator]
      # Chaque run réécrit tous les posts (updated_at = maintenant), même sans
      # nouveau chiffre : une table qui vieillit veut dire que le run n'écrit plus.
      table: creator_posts
      date_column: updated_at
      max_age_hours: 36
      remediation: >-
        Vérifier le secret BUFFER_API_KEY (clé régénérée dans Buffer → mettre à
        jour le secret GitHub) puis relancer le workflow à la main.
    script: "pipelines/creator_sync.py"
    input_api: "Buffer GraphQL API (posts + métriques) + pages publiques TikTok / YouTube (abonnés)"
    output_tables:
      - creator_episodes
      - creator_posts
      - creator_post_readings
      - creator_audience
    read_tables:
      - creator_episodes
      - creator_posts
      - creator_post_readings
    avg_duration_s: 20
    budget_usd: 0
    status: active
    notes: "Buffer relit chaque réseau une fois par jour (metricsUpdatedAt, ~20:00 UTC observé) : le passage de 21:40 prend les chiffres du jour, celui de 06:40 les posts Instagram partis à 22:30 UTC. Épisode d'un post : base, puis URL de la vidéo hébergée (remplacée par Buffer après publication), puis post frère du même jour à New York (ADR-54)."

  - id: sport_sync
    name: "Veille sport RSS"
    cron: "30 6 * * *"
    human_time: "Quotidien 06:30 UTC"
    workflow_file: ".github/workflows/sport-sync.yml"
    health:
      domain: veille_satellite
      panels: [sport]
      table: sport_articles
      date_column: fetch_date
      max_age_hours: 30
      remediation: >-
        Un flux RSS sport est mort ou a changé d'URL : lire le log du run pour
        identifier lequel, puis corriger la liste des flux dans le script.
    script: "pipelines/sport_sync.py"
    input_api: "RSS (L'Équipe, RMC Sport, Millenium, Cyclism'Actu…)"
    output_tables:
      - sport_articles
    read_tables: []
