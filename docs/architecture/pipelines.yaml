  - id: pipeline_health
    name: "Santé des pipelines (observation externe)"
    cron: "0 9 * * *"
    human_time: "Quotidien 09:00 UTC"
    workflow_file: ".github/workflows/pipeline-health.yml"
    health:
      domain: socle
      panels: []
      impact: >-
        Les états affichés partout ailleurs gèlent sur leur dernier verdict connu :
        un « tout va bien » périmé est pire que pas de verdict du tout.
      remediation: >-
        Ouvrir le dernier run : le plus souvent, un GITHUB_TOKEN expiré ou un
        SUPABASE_SERVICE_KEY tourné.
    script: "pipelines/pipeline_health.py"
    input_api: "API GitHub Actions (lecture des conclusions de run)"
    output_tables:
      - pipeline_health
    read_tables:
      - articles
      - learning_recommendations
      - steam_games_snapshot
      - sport_articles
      - gaming_articles
      - anime_articles
      - news_articles
      - media_entries
      - strava_activities
      - withings_measurements
      - music_scrobbles
      - tft_matches
    avg_duration_s: 20
    budget_usd: 0
    status: active
    # Le surveillant s'inscrit dans sa propre table depuis le 2026-08-20, et ça ne
    # suffit pas : un surveillant mort ne rapporte pas sa mort. Les deux gardes se
    # complètent. Le bloc `health` ci-dessus attrape la panne INTERMITTENTE — le run
    # en cours n'a pas encore de conclusion, il est donc écarté par
    # DECISIVE_CONCLUSIONS et chaque run rapporte le verdict du précédent, si bien
    # qu'un échec isolé finit par sortir. La panne DÉFINITIVE (token expiré, plus
    # aucun run) ne laisse personne pour l'écrire : c'est le front qui la voit, en
    # comparant pipeline_health.checked_at à l'heure courante — cf.
    # PipelineHealthBanner, et l'onglet Santé qui en fait une ligne visible.
    notes: >-
      Tourne à 09:00 UTC, après le dernier cron du matin (07:45), donc sur un état
      stabilisé. Sort en code 0 même quand des pipelines sont dégradés : il rapporte
      l'état, il ne le subit pas. Depuis le 2026-08-17 (ADR-38) il tient aussi à jour
      UNE issue GitHub « [pipelines] Pipelines dégradés » — corps réécrit à chaque
      passage (le cron est quotidien, commenter ferait 365 notifications/an), fermée
      automatiquement au retour au vert. C'est le seul canal qui voit les DEUX cas :
      un hook `if: failure()` ne verrait pas un pipeline `stale`, c'est-à-dire vert
      mais n'écrivant rien — la panne exacte qui s'est cachée cinq semaines.
      Requiert `issues: write` : les permissions par défaut du dépôt sont `read`.

  - id: backup_supabase
    name: "Sauvegarde des données saisies"
    cron: "0 4 * * 0"
    human_time: "Hebdomadaire dimanche 04:00 UTC"
    workflow_file: ".github/workflows/backup-supabase.yml"
    script: "pipelines/backup_supabase.py"
    input_api: "PostgREST (service key) — aucun appel externe"
    output_tables: []
    read_tables:
      - jobs
      - job_scans
      - user_profile
      - user_profile_history
      - profile_facts
      - skill_radar
      - business_ideas
      - commitments
      - uncomfortable_questions
      - media_entries
      - media_progress
      - media_franchises
      - media_releases
      - game_titles
      - game_progress
      - game_franchises
      - game_releases
      - gaming_wishlist
      - jp_seen
      - article_feedback
      - challenge_attempts
      - history_notes
      # Ajoutées le 2026-08-21 : datées, donc non refabricables à l'identique.
      - usage_events
      - signal_tracking
      - daily_briefs
      - jarvis_conversations
    avg_duration_s: 30
    budget_usd: 0
    status: active
    # Bloc `health` sans sonde de fraîcheur : ce pipeline n'écrit aucune table,
    # sa sortie est un artefact de run (ADR-37). C'est le troisième cas du
    # contrat déclaré en tête de fichier — seul le verdict du run compte. Il
    # reste surveillé : une sauvegarde qu'aucune surface ne regarde est une
    # sauvegarde qu'on découvre absente le jour où on en a besoin.
    health:
      domain: socle
      panels: []
      # Cron hebdomadaire (168 h) + 24 h de marge pour le retard de déclenchement
      # GitHub, qui va couramment de 30 à 60 min. C'est le SEUL signal de cette
      # brique : sans cette clé, un cron qui cesserait d'être déclenché la
      # laisserait verte indéfiniment (ADR-45).
      max_run_age_hours: 192
      impact: >-
        Aucune surface ne le montre. Les saisies que rien ne sait refabriquer
        (offres, profil, idées, engagements, notes, progression média) ne sont
        plus copiées.
      remediation: >-
        Ouvrir le dernier run et lire quelle table a échoué : le script sort en
        code 1 dès qu'une seule table manque ou que le total est vide.
    notes: >-
      Périmètre restreint aux données qu'aucun pipeline ne sait refabriquer À L'IDENTIQUE.
      Le critère a été élargi le 2026-08-21 : il ne suffit pas de demander « qui produit
      cette donnée ? » (pipeline = refabriquable, utilisateur = non), il faut demander si
      le producteur en est encore capable. Tout ce qui est daté ne l'est pas — les items
      RSS disparaissent de leur flux. D'où l'ajout de usage_events (seule mesure de
      l'usage réel du cockpit), daily_briefs, signal_tracking et jarvis_conversations.
      Les corpus RSS bruts, scrobbles, snapshots Steam et l'index vectoriel de Jarvis
      restent exclus : ils se régénèrent depuis leur source. Sortie = un artefact de run
      conservé 90 jours (1,0 Mo au 2026-08-21), pas une table — et il vit chez GitHub,
      c'est-à-dire chez l'hébergeur de ce qui le produit. Transport PostgREST et non
      pg_dump, faute de mot de passe Postgres dans les secrets. ADR-37, élargi par ADR-45.

# Pipelines locaux (pas GitHub Actions) — listés ici pour la vue d'ensemble,
# mais non inclus dans la timeline 24h côté UI.
local_pipelines:
  - id: jarvis_nightly_learner
    name: "Nightly learner (extraction faits + entités)"
    trigger: "Scheduler asyncio minuit local + POST /nightly-learner + start_jarvis.bat"
    script: "jarvis/nightly_learner.py"
    input_api: "Qwen3.5 9B Instruct (LM Studio local) + sources locales"
    read_sources:
      - jarvis_conversations
      - "jarvis_data/activity_*.jsonl"
      - "jarvis_data/outlook_*.json"
    output_tables:
      - profile_facts
      - entities
    notes: "Idempotent via checkpoint dans jarvis_data/nightly_learner_state.json. Reindex memories_vectors après extraction."

  - id: jarvis_indexer
    name: "Indexer pgvector (embeddings)"
    trigger: "check_index_freshness.py au boot + manuel"
    script: "jarvis/indexer.py"
    input_api: "Qwen3-Embedding-0.6B (LM Studio local)"
    read_sources:
      - articles
      - wiki_concepts
      - weekly_opportunities
      - business_ideas
      - rte_usecases
      - user_profile
      - profile_facts
      - entities
    output_tables:
      - memories_vectors
    notes: "Dimension 1024 figée. Changer de modèle d'embedding = réindexer tout."

  - id: activity_brief_generator
    name: "Brief quotidien d'activité (18h)"
    trigger: "Scheduler asyncio 18h local + POST /generate-activity-brief"
    script: "jarvis/observers/daily_brief_generator.py"
    input_api: "Qwen3.5 9B (LM Studio local)"
    read_sources:
      - "jarvis_data/activity_<today>.jsonl"
      - "jarvis_data/outlook_<today>.json"
    output_tables:
      - activity_briefs
    notes: "Seul le résumé HTML monte dans Supabase (privacy-first). Les données brutes d'activité restent locales."

# Routines Claude Code distantes (claude.ai, hors GitHub Actions) — listées pour
# la vue d'ensemble, NON incluses dans la timeline crons côté UI (le renderer ne
# lit que `pipelines:`). Sandbox cloud Anthropic, planifiées via le skill `schedule`.
external_routines:
  - id: jobs_radar_routine
    name: "Jobs Radar (JSearch + Sonnet, routine distante)"
    trigger: "claude.ai routine trig_01JtTsMm27eTAGxR5po5KmMQ — cron 0 6 * * 1,3,5 (lun/mer/ven 08:00 Paris, 3×/sem ; réduit depuis 1,3,5,0 — ADR-27)"
    model: "claude-sonnet-4-6"
    input_api: "JSearch (RapidAPI, tier gratuit, quota 200 req/mois ; la date de reset ne se devine pas — seul l en-tete X-RateLimit-Requests-Reset fait foi, mesure du 2026-08-27 : fin de fenetre 22:22 UTC avec 60 req restantes, pas 200 — ADR-50) — fetch via curl, 10 req/run (socle 6 + rotation 4) × 13 runs ≈ 130 req/mois, soit 65% du quota (ADR-50 ; ADR-31 ; les 11 req/run d'ADR-27 ≈143 ont re-saturé le quota → raw_count 0 du 10 au 27/07). Le fetch cloud fonctionne (HTTP 200 vérifié le 2026-07-28) : le 403 Host not in allowlist d'ADR-21 ne s'applique plus. Diagnostic d'une panne : job_scans.tendances->'fetch' (codes HTTP, quota restant, aborted_reason)"
    mcp: "Supabase (execute_sql, service_role)"
    output_tables:
      - jobs
      - job_scans
    read_tables:
      - jobs
      - user_profile
      - skill_radar
    budget_usd: 0   # couverte par le plan Max (pas de facturation par run)
    status: active
    health:
      domain: business
      panels: [jobs]
      table: job_scans
      date_column: scan_date
      # Cron lun/mer/ven : le plus grand trou nominal est vendredi→lundi, soit
      # ~72 h. 96 h laisse une marge d'un run raté sans crier au loup.
      max_age_hours: 96
      remediation: >-
        Lire job_scans.tendances->'fetch' (codes HTTP, quota restant) : le quota
        JSearch est de 200 req/mois ; sa date de reset se lit dans l en-tête
        X-RateLimit-Requests-Reset, elle ne se devine pas (ADR-50). Puis vérifier la
        routine trig_01JtTsMm27eTAGxR5po5KmMQ sur claude.ai.
    notes: "Remplace la routine Cowork LinkedIn (ADR-19). 11 requêtes validées (5 IA + 2 EM/delivery, ADR-22 ; requête complète sans suffixe 'in France', ADR-21), dédup logique (employeur+titre normalisé, fallback linkedin_job_id=id JSearch ; ADR-25), scoring rubric /10 + skills on_cv + salaire. v2.1 (ADR-20) : filtre FULLTIME pré-scoring, skills depuis job_highlights, colonne is_remote, logo employeur. v2.2 (ADR-21) : requêtes réorientées IA + job_pref_rules de Jean ; JSearch 403 en cloud (IP datacenter) → fetch local de secours. v2.3 (ADR-22) : Engagement/Delivery Manager = rôle cible (scope tech/IA, exclusion conseil/ESN maintenue), valeur role_category 'em'. v2.4 (ADR-25) : dédup logique (employeur+titre) anti-doublons-syndiqués + sélection d'URL durable (apply_options.is_direct → ATS/officiel → linkedin, rejet des endpoints jsearch.p.rapidapi.com), tracé dans intel.link_source. v2.5 (ADR-26) : ÉTAPE 6 vieillissement = auto-archive des leads 'new' non revus >30j (annonce fermée), gardé contre les échecs de fetch (total_fetche>0), jamais applied/snoozed/décisions user. v2.6 (ADR-27) : fréquence ramenée à 3×/sem (lun/mer/ven) pour tenir sous le quota JSearch 200/mois (4×/sem ≈191 saturait → 429 le 2026-06-26, raw_count 110→0). v2.7 (ADR-31) : 2e panne quota (10→27/07, 3 semaines à raw_count 0, non détectée) → santé du fetch journalisée dans job_scans.tendances->'fetch' (une panne n'est plus indiscernable d'un jour calme), discipline quota (zéro retry, arrêt sur 429, lecture de X-RateLimit dès la 1re requête), 8 requêtes/run en socle+rotation A/B/C par jour_de_l_année mod 3 (couverture 14 requêtes distinctes contre 11, conso ≈104/mois), ÉTAPE 6 comptée en scans réussis et non en jours calendaires (la panne aurait auto-archivé 38 leads vivants), ÉTAPE 7 recalibrage hebdo de user_profile.job_pref_observed (lundi, seuil ≥3 nouveaux verdicts ; job_pref_rules jamais touché), intel.source_query pour mesurer le rendement par requête, intel.link_source reverrouillé sur son vocabulaire fermé. v2.8 (ADR-32, migration sql/026) : fin des offres mortes qui ressortent — la dédup passe par la colonne générée indexée jobs.logical_key (fonction IMMUTABLE jobs_logical_key, source unique partagée avec le trigger) et n'a PLUS de fenêtre temporelle (les 45j rataient Postman d'un jour) ; le trigger jobs_inherit_user_status hérite closed_at sans péremption et applied, et exclut les auto-archivages via le marqueur user_notes ; la routine ne recalcule plus la clé et ne ressuscite jamais une offre déjà jugée. v2.9 (ADR-33) : la calibration tournait (27/27 offres avec clé calibrage) mais ne mordait pas — un TPM Défense chez Cohere portait « résonne avec rejet Mistral TPM. Score ajusté » et sortait à 8.0 en new. user_profile.job_pref_observed devient une TABLE DE PÉNALITÉS CHIFFRÉES dérivée des 17 verdicts (tous commentés), avec VETO sur expertise verticale absente ; l'ÉTAPE 3 l'applique en cumulant et doit nommer chaque montant dans rubric_justif.calibrage ; l'ÉTAPE 7 doit préserver ce format. Intel warm + reco CV abandonnés. Clé RapidAPI inline dans le prompt (pas un secret GitHub). v3.0 (ADR-50) : le pilotage cesse d etre une exception toleree. Mesure sur 60j : pgm 91 offres → 12 new, em 63 → 3, pjm 30 → 0, alimentes par Safran/Capgemini/Wavestone/Accenture/MBDA (zero licorne, zero GAFAM). Deux causes traitees separement — sourcing (le suffixe 'in France' ramene des employeurs nationaux : senior program manager in France = 0 retenue sur 10, la variante Paris ramene Criteo/Databricks/Parloa) et rubric (l IA au coeur etait exigee sur score_sector). Passage a 10 req/run (socle 6 + rotation 4), 18 requetes distinctes contre 14, les 8 nouvelles validees contre JSearch le 2026-08-27 avant ecriture. Scoring : deux rangs de roles cibles (le pilotage en boite tech desirable devient premier rang), definition ecrite de 'boite tech desirable' dans job_pref_rules (anti-critere prestation intellectuelle + 2 criteres sur 4 + liste d ancrage), bonus +1.5 non cumulable avec le +1.0 de job_pref_observed, plafond 6.9 pour un pilotage sans angle IA (visible, jamais hot lead), score_seniority sur DEUX compteurs (8 ans pilotage / 3 ans produit) a chiffrer dans rubric_justif.seniority, penalite TPM relue sur la substance et non sur le titre. Aucun re-scoring retroactif : jobs ne stocke pas la description de l annonce. Doc : docs/cowork-routines/jobs-radar.md."
