  - id: anime_sync
    name: "Veille anime / ciné / séries (+ Jikan)"
    cron: "0 7 * * *"
    human_time: "Quotidien 07:00 UTC"
    workflow_file: ".github/workflows/anime-sync.yml"
    health:
      domain: veille_satellite
      panels: [anime]
      table: anime_articles
      date_column: fetch_date
      max_age_hours: 30
      remediation: >-
        Un flux RSS anime est mort, ou l'API Jikan est en rate limit : lire le
        log du run pour trancher.
    script: "pipelines/anime_sync.py"
    input_api: "RSS (AlloCiné, Première, ANN, Deadline, Variety…) + Jikan API v4 (MyAnimeList)"
    output_tables:
      - anime_articles
    read_tables: []
    avg_duration_s: 60
    budget_usd: 0
    status: active
    notes: "Pipeline TMDB (pipelines/tmdb_sync.py) scaffoldé mais pas de workflow actif — nécessite TMDB_API_KEY. À ne pas confondre avec tmdb_tracker_sync : celui-ci alimente le calendrier `anime_articles` de cet onglet, l'autre la médiathèque. Les deux ne partagent que le secret."

  - id: anime_tracker_sync
    name: "Médiathèque anime (tracker AniList)"
    cron: "30 7 * * *"
    human_time: "Quotidien 07:30 UTC"
    workflow_file: ".github/workflows/anime-tracker-sync.yml"
    health:
      domain: mediatheque
      panels: [mediatheque]
      table: media_entries
      date_column: updated_at
      # `media_entries` a DEUX écrivains : ce pipeline et tmdb_tracker_sync.
      # Sans filtre, une panne AniList est masquée par les écritures TMDB.
      filter: "source=eq.anilist"
      max_age_hours: 30
      remediation: >-
        AniList est en rate limit ou une franchise suivie a été retirée du
        catalogue : lire le log du run.
    script: "pipelines/anime_tracker_sync.py"
    input_api: "AniList GraphQL (public, sans clé)"
    output_tables:
      - media_entries
      - media_releases
      - media_franchises
    read_tables:
      - media_franchises
      - media_entries
    avg_duration_s: 60
    budget_usd: 0
    status: active
    notes: "Ne rafraîchit QUE les franchises de la bibliothèque, et seulement celles en source='anilist' (franchises_qs/entries_qs — sans ce filtre un source_root_id TMDB partirait vers AniList). Batchs id_in de 25, throttle 2,5 s (< 30 req/min AniList). Événements dédupliqués par UNIQUE(entry_id,event_type). Walk = contrat commun avec cockpit/lib/anilist.js (tests/fixtures/franchise_graphs.json). Transport Supabase + diff_events partagés via pipelines/media_tracker_common.py."

  - id: tmdb_tracker_sync
    name: "Médiathèque films & séries (tracker TMDB)"
    cron: "45 7 * * *"
    human_time: "Quotidien 07:45 UTC"
    workflow_file: ".github/workflows/tmdb-tracker-sync.yml"
    health:
      domain: mediatheque
      panels: [mediatheque]
      table: media_entries
      date_column: updated_at
      filter: "source=in.(tmdb_tv,tmdb_movie)"
      max_age_hours: 30
      remediation: >-
        Vérifier la clé TMDB_API_KEY dans les secrets GitHub, puis relancer
        tmdb-tracker-sync.yml.
    script: "pipelines/tmdb_tracker_sync.py"
    input_api: "TMDB REST v3 (TMDB_API_KEY)"
    output_tables:
      - media_entries
      - media_releases
      - media_franchises
    read_tables:
      - media_franchises
      - media_entries
    avg_duration_s: 45
    budget_usd: 0
    status: active
    notes: "Jumeau de anime_tracker_sync pour la source TMDB, décalé de 15 min pour ne pas empiler deux syncs de media_entries sur la même minute. Borné à source in (tmdb_movie, tmdb_tv / tmdb_season). Traduit TMDB dans le contrat AniList à l'ingestion — duplication assumée de cockpit/lib/tmdb.js (un pipeline Python ne peut pas importer un module JS), verrouillée par les tests jumeaux tests/test_tmdb_map.py et .mjs. Sans TMDB_API_KEY : sortie [skip] code 0, le workflow reste vert. NE PAS confondre avec tmdb_sync.py (calendrier de l'onglet Veille)."

  - id: igdb_tracker_sync
    name: "Tracker jeux (IGDB + seed Steam)"
    cron: "30 8 * * *"
    human_time: "Quotidien 08:30 UTC"
    workflow_file: ".github/workflows/igdb-tracker-sync.yml"
    health:
      domain: perso
      # Gaming consomme game_releases depuis ADR-35/36 (rail « À venir »,
      # acquittement), au même titre que l'encart Jeux du Brief.
      panels: [brief, gaming]
      # Volontairement sans sonde de fraîcheur : depuis le 2026-08-14, le front
      # écrit lui aussi game_titles / game_releases / game_franchises (ADR-36)
      # et aucune colonne ne distingue le pipeline de l'utilisateur. Une sonde
      # serait verte grâce aux écritures du front. L'onglet Santé affiche donc
      # « fraîcheur inconnue » plutôt qu'un vert qui mentirait.
      remediation: >-
        Vérifier les identifiants Twitch/IGDB dans les secrets GitHub — le token
        IGDB se renouvelle via l'API Twitch et échoue silencieusement si le
        client secret a tourné.
    script: "pipelines/igdb_tracker_sync.py"
    input_api: "IGDB v4 (TWITCH_CLIENT_ID + TWITCH_CLIENT_SECRET)"
    output_tables:
      - game_franchises
      - game_titles
      - game_releases
      # Écriture CONDITIONNELLE, uniquement sous le drapeau one-shot
      # --import-wishlist, et en ignore_dupes : les phases A/B/C/D
      # nominales ne touchent jamais game_progress.
      - game_progress
    read_tables:
      - game_franchises
      - game_titles
      - steam_games_snapshot
      - gaming_wishlist
    avg_duration_s: 120
    budget_usd: 0
    status: active
    notes: "Quatre phases — seed (appids Steam traduits en ids IGDB via external_games), refresh des collections watched, diff, durée de jeu (game_time_to_beats, cap 50/run). N'écrit JAMAIS game_progress, qui appartient à l'utilisateur — sauf via import_wishlist() en ignore_dupes, qui n'écrase jamais un statut déjà posé (voir docstring du script). La colonne game_franchises.bootstrapped_at garantit qu'une franchise peuplée pour la première fois n'émet aucun événement : sans elle le premier run inonderait le Brief de centaines d'annonces pour des jeux sortis il y a dix ans. Elle n'est posée QUE par la phase B, seule à parcourir réellement la collection — le seed Steam et l'import wishlist n'écrivent qu'un titre et ne tamponnent rien. Le run sort en 1 (workflow rouge) si aucun appid Steam ne se traduit en id IGDB ou si toutes les licences surveillées échouent ; la phase D, enrichissement facultatif, est encapsulée et ne fait jamais rougir un run dont A/B/C ont écrit. IGDB limite à 4 req/s (throttle 0.25 s) et refuse le CORS navigateur — la recherche front du lot 2 exigera une Edge Function. Sans les secrets Twitch : sortie [skip] code 0."

  - id: news_sync
    name: "Actualités généralistes RSS"
    cron: "15 7 * * *"
    human_time: "Quotidien 07:15 UTC"
    workflow_file: ".github/workflows/news-sync.yml"
    health:
      domain: veille_satellite
      panels: [news]
      table: news_articles
      date_column: fetch_date
      max_age_hours: 30
      remediation: >-
        Un flux RSS actualités est mort ou a changé d'URL : lire le log du run
        pour identifier lequel.
    script: "pipelines/news_sync.py"
    input_api: "RSS (Le Monde, Le Figaro, FranceInfo, BFM Paris, BBC World, France 24, RFI…)"
    output_tables:
      - news_articles
    read_tables: []
    avg_duration_s: 30
    budget_usd: 0
    status: active

  - id: veille_picks
    name: "Sélection de la veille (+ recalibrage)"
    cron: "30 6 * * *"
    human_time: "Quotidien 06:30 UTC"
    workflow_file: ".github/workflows/veille-picks.yml"
    script: "pipelines/veille_picks.py"
    input_api: "Gemini 2.5 Flash-Lite"
    output_tables:
      - daily_picks
      - user_profile          # veille_pref_rules + veille_pref_updated_at
    read_tables:
      - articles
      - article_feedback
      - user_profile
    avg_duration_s: 30
    budget_usd: 0
    status: active
    health:
      domain: veille_ia
      panels: [brief, top]
      table: daily_picks
      date_column: created_at
      max_age_hours: 30
      remediation: >-
        Dépend des articles du jour : vérifier d'abord daily_digest. Si la veille
        tourne, relancer veille-picks.yml.
    notes: >
      Tourne à 06:30 UTC, après daily_digest (06:00) qui remplit `articles`. Pipeline SÉPARÉ de
      main.py délibérément : si la sélection casse, le brief doit continuer — le front retombe
      alors sur l'ordre de crawl (buildTop, drapeau `picked: false`). Mais « continuer » n'est
      pas « se taire » : depuis le 2026-08-21 les DEUX vides sortent en code 1, et se distinguent
      par le message. Table `articles` du jour vide = l'amont est mort, daily_digest n'a rien
      écrit, la sélection ne PEUT pas tourner (c'est le cas resté invisible du 18 au 21 août :
      le run sortait vert tous les jours et seule la sonde de fraîcheur de pipeline_health l'a
      vu). Articles présents mais aucun pick retenu = la sélection est stérile, le message donne
      le nombre d'articles livrés. Recalibrage AVANT sélection pour que les règles fraîches servent le jour
      même. Seuil MIN_VOTES_TO_RECALIBRATE=8 : en dessous on écrirait du bruit, et une règle fausse
      coûte plus cher qu'une règle absente. Le profil injecté est filtré par liste blanche
      (PROFILE_KEYS_FOR_PROMPT) — sans ça les clés d'API stockées dans user_profile (lastfm, tmdb)
      partiraient chez Gemini ; verrouillé par tests/test_veille_picks.py.

  - id: jp_vocab_sync
