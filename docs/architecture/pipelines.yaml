        puis relancer jp-vocab-sync.yml.
    notes: >
      Tourne après anime_tracker_sync (07:30), seul pipeline pouvant faire apparaître de
      nouvelles franchises. Ne retraite jamais une franchise déjà traitée : les 44 franchises
      actuelles coûtent 44 appels au premier run, puis zéro. Borné à media_type=anime — un film
