  - name: music_loved_tracks
    owner_pipeline: lastfm_sync
    rls: authenticated
    domain: musique

  - name: music_scrobbles
    owner_pipeline: lastfm_sync
    rls: authenticated
    domain: musique

  - name: music_scrobbles_raw
    owner_pipeline: lastfm_sync
    rls: service_role
    domain: musique

  - name: music_stats_daily
    owner_pipeline: lastfm_sync
    rls: authenticated
    domain: musique

  - name: music_top_weekly
    owner_pipeline: lastfm_sync
    rls: authenticated
    domain: musique

  - name: news_articles
    owner_pipeline: news_sync
    rls: authenticated
    domain: veille

  - name: article_feedback
    owner_pipeline: front   # vote 👍/👎 sur la sélection du jour, écrit depuis le Brief
    rls: authenticated      # SELECT + INSERT + UPDATE, jamais DELETE (on ne supprime pas une trace d'apprentissage)
    domain: veille

  - name: daily_picks
    owner_pipeline: veille_picks
    rls: authenticated      # SELECT seul — le pipeline écrit en service_role
    domain: veille

  - name: jp_seen
    owner_pipeline: front   # marquage « je connais », écrit uniquement depuis la Médiathèque
    rls: authenticated      # SELECT + INSERT + UPDATE, jamais DELETE
    domain: perso

  - name: jp_words
    owner_pipeline: jp_vocab_sync
    rls: authenticated      # SELECT seul — le pipeline écrit en service_role
    domain: perso

  - name: pipeline_health
    owner_pipeline: pipeline_health   # observation externe : lit l'API GitHub Actions + la fraîcheur des tables
    rls: authenticated  # SELECT seul pour authenticated — aucune policy d'écriture, seul le service_role alimente
    domain: systeme

  - name: profile_facts
    owner_pipeline: jarvis_nightly_learner
    rls: authenticated
    domain: jarvis

