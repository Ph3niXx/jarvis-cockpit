# Matrice panel ↔ table — source de vérité de la vue "Dépendances"
# dans Jarvis Lab.
#
# panels[]  : chaque panel du cockpit avec fichier source + tables qu'il
#             lit et/ou écrit via les API REST Supabase.
# tables[]  : chaque table Supabase avec son owner_pipeline (qui y écrit
#             en principal) et sa politique RLS effective.
#
# RLS values :
#   authenticated : SELECT/INSERT/UPDATE/DELETE requiert JWT authenticated
#   service_role  : écriture réservée au service_role (pipelines backend)
#   public        : policy using(true) — lisible par tout apikey holder
#
# Conventions :
#   - "reads" liste les tables effectivement GET côté front
#   - "writes" liste les tables POST/PATCH/DELETE côté front
#   - "rpcs" liste les fonctions RPC Supabase appelées (ex : match_memories)
#   - "static_sources" pour les sources non-Supabase (fichiers docs, JSON statiques)

panels:
  - id: brief
    file: cockpit/home.jsx
    reads: [articles, daily_briefs, signal_tracking, skill_radar, user_profile, weekly_analysis, daily_picks, article_feedback, game_releases]  # daily_picks = sélection raisonnée du jour (remplace le slice(0,3)), article_feedback = état des boutons de vote, game_releases = encart GamesBriefCard (non acquittés < 30j, Tier 1)
    writes: [article_feedback, game_releases, game_franchises]  # vote 👍/👎 (recalibrage veille_picks) ; GamesBriefCard : ack() patch game_releases.acknowledged, unwatch() patch game_franchises.watched=false + acquitte l'événement

  - id: evening
    file: cockpit/panel-evening.jsx
    reads: [daily_mirror]
    writes: []

  - id: review
    file: cockpit/panel-review.jsx
    reads: [articles]   # via data.top + data.week.items hydratés en Tier 1
    writes: [usage_events]  # track("review_action") sur skip/save

  - id: top
    file: cockpit/panel-top.jsx
    reads: [articles, daily_picks]  # consomme COCKPIT_DATA.top, alimenté par buildTop(articles, dailyPicks)
    writes: []

  - id: week
    file: cockpit/panel-week.jsx
    reads: [articles]
    writes: []

  - id: search
    file: cockpit/panel-search.jsx
    reads: [articles, wiki_concepts, business_ideas, jarvis_conversations]
    writes: []

  - id: updates
    file: cockpit/panel-veille.jsx
    corpus: VEILLE_DATA
    reads: [articles, signal_tracking]
    writes: []

  - id: claude
    file: cockpit/panel-veille.jsx
    corpus: CLAUDE_DATA
    reads: [articles]   # filtrés section=claude
    writes: []

  - id: sport
    file: cockpit/panel-veille.jsx
    corpus: SPORT_DATA
    reads: [sport_articles]
    writes: []

  - id: gaming_news
    file: cockpit/panel-veille.jsx
    corpus: GAMING_DATA
    reads: [gaming_articles]
    writes: []

  - id: anime
    file: cockpit/panel-veille.jsx
    corpus: ANIME_DATA
    reads: [anime_articles]
    writes: []

  - id: news
    file: cockpit/panel-veille.jsx
    corpus: NEWS_DATA
    reads: [news_articles]
    writes: []

  - id: radar
    file: cockpit/panel-radar.jsx
    reads: [skill_radar]
    writes: [skill_radar]  # bumped depuis panel-challenges après pass ≥ 70%

  - id: recos
    file: cockpit/panel-recos.jsx
    reads: [learning_recommendations, skill_radar]
    writes: [learning_recommendations]  # completed, completed_at

  - id: challenges
    file: cockpit/panel-challenges.jsx
    reads: [weekly_challenges, challenge_attempts, skill_radar]
    writes: [challenge_attempts, skill_radar]  # bump radar si 1er pass ≥ 70%

  - id: wiki
    file: cockpit/panel-wiki.jsx
    reads: [wiki_concepts]
    writes: [wiki_concepts]  # flow "J'écris ma note" → source_type=perso

  - id: signals
    file: cockpit/panel-signals.jsx
    reads: [signal_tracking, wiki_concepts, weekly_analysis]
    writes: []

  - id: opps
    file: cockpit/panel-opportunities.jsx
    reads: [weekly_opportunities, articles, signal_tracking]
    writes: [weekly_opportunities, business_ideas]  # user_status + Send to Ideas

  - id: ideas
    file: cockpit/panel-ideas.jsx
    reads: [business_ideas]
    writes: [business_ideas]

  - id: veille-outils
    file: cockpit/panel-veille-outils.jsx
    reads: [claude_veille, claude_ecosystem, ai_landscape]
    writes:
      - claude_veille      # status + notes via authenticated UPDATE (INSERT réservé routine Cowork via service_role)
      - claude_ecosystem   # status + user_priority + is_pinned + user_notes via UPDATE, ajout manuel via INSERT (authenticated)
      - ai_landscape       # status + user_priority + is_pinned + user_notes via UPDATE (pas d'ajout manuel en v1 — ADR-51)

  - id: jobs
    file: cockpit/panel-jobs-radar.jsx
    reads:
      - jobs
      - job_scans
      - user_profile  # job_pref_rules (règles utilisateur verrouillées), job_pref_observed (profil inféré par la routine Jobs Radar) — Lot 2/3
      - market_skill_gap  # VUE (sql/031), pas une table : agrège jobs.intel->skills_required pour le bloc « Ce que le marché te reproche » (ADR-39)
    writes: [jobs]  # status + user_notes + user_verdict + user_verdict_reason + user_verdict_at + closed_at + applied_at + last_followup_at + followup_count (whitelist)
    realtime:
      channel: jobs_radar_sub
      tables: [jobs, job_scans]

  - id: jarvis
    file: cockpit/panel-jarvis.jsx
    reads: [jarvis_conversations, profile_facts, user_profile]
    writes: [profile_facts]  # superseded_by (oublier) + pinned (épingler)
    external:
      - "POST /chat → localhost:8765 OR tunnel Cloudflare"

  - id: jarvis-lab
    file: cockpit/panel-jarvis-lab.jsx
    reads: []
    writes: []
    static_sources:
      - jarvis/spec.json
      - docs/specs/index.json
      - docs/specs/tab-*.md
      - docs/architecture/layers.yaml
      - docs/architecture/pipelines.yaml
      - docs/architecture/dependencies.yaml
      - docs/architecture/flows/*.yaml

  - id: profile
    file: cockpit/panel-profile.jsx
    reads: [user_profile, profile_facts, entities, commitments, uncomfortable_questions, user_profile_history]
    writes: [user_profile, profile_facts, commitments, uncomfortable_questions]

  - id: perf
    file: cockpit/panel-forme.jsx
    reads: [strava_activities, withings_measurements, user_profile]
    writes: []

  - id: music
    file: cockpit/panel-musique.jsx
    reads:
      - music_scrobbles
      - music_stats_daily
      - music_top_weekly
      - music_loved_tracks
      - music_genre_weekly
      - music_insights_weekly
      - user_profile  # lastfm_api_key + lastfm_username pour polling live
    writes: []
    rpcs: [music_discoveries]
    external:
      - "Last.fm API polling 30s (now playing)"

  - id: gaming
    file: cockpit/panel-gaming.jsx
    reads:
      - steam_games_snapshot
      - steam_game_details
      - steam_achievements
      - gaming_stats_daily
      - tft_rank_history
      - tft_matches
      - game_titles
      - game_franchises
      - game_progress
      - game_releases
    writes: [game_progress, game_franchises, game_titles, game_releases]
    # game_titles en write : addConsoleGame() POST une ligne game_titles
    # quand l'utilisateur ajoute un jeu console via la recherche IGDB —
    # écriture manuelle depuis le panel, jamais depuis le pipeline (qui,
    # lui, seed game_titles en écriture batch, cf. flows/perso-jeux.yaml).
    # gaming_wishlist retirée de reads/writes : la §5 (lecture seule) a été
    # dépubliée du panel le 2026-08-13, absorbée dans game_progress via
    # igdb_tracker_sync::import_wishlist() (Task 6). La table reste en base
    # (8 lignes), simplement plus lue par ce panel — voir ADR-34 et
    # docs/specs/tab-gaming.md.
    # Lot 2 (bibliothèque à statuts + rail À venir) implémenté depuis les
    # commits 53460ea..7eff8d1 : lit game_titles/game_franchises/
    # game_progress/game_releases (fiche jeu, ajout jeu console, rail À
    # venir) ; écrit game_progress (statut/note/plateforme), game_franchises
    # (watched), game_titles (ajout jeu console), game_releases
    # (acknowledged). Cette entrée reads/writes
    # était restée non mise à jour depuis lot 1 jusqu'au 2026-08-13 (Task 8
    # du lot 2) — corrigée à cette occasion, voir docs/specs/tab-gaming.md.
    # Depuis le 2026-08-14, game_releases est aussi écrite en INSERT par ce
    # panel (et plus seulement en PATCH acknowledged) : syncFranchiseUpcoming()
    # crée les événements « À venir » d'une licence dès qu'on la suit, sans
    # attendre le cron de 08:30 UTC. Deuxième producteur de la table, aux
    # mêmes clés (UNIQUE title_id,event_type) et au même libellé que le
    # pipeline — voir ADR-36.

  - id: mediatheque
    file: cockpit/panel-mediatheque.jsx
    reads: [media_franchises, media_entries, media_progress, media_releases, activity_briefs, jp_words, jp_seen]  # activity_briefs = 1 ligne (jour courant), stats.meetings, pour la seule accroche de « Ce soir » ; jp_* = bande « Avant l'épisode »
    writes: [media_franchises, media_entries, media_progress, media_releases, jp_seen, usage_events]  # ajout/progression/ack ; entries créées à l'ajout puis pipeline-owned ; jp_seen = marquage « je connais »

  - id: sante
    file: cockpit/panel-sante.jsx
    reads: [pipeline_health]   # Tier 1, chargée en entier par bootTier1 — aucun fetch propre
    writes: []

  - id: stacks
    file: cockpit/panel-stacks.jsx
    reads: [weekly_analysis, articles, user_profile]
    writes: [user_profile]  # upsert stacks.anthropic_balance_usd, stacks.gemini_*, etc.
    rpcs: [get_stack_stats, get_gemini_usage_stats]
    external:
      - "Frankfurter API (taux USD→EUR quotidien)"

  - id: history
    file: cockpit/panel-history.jsx
    reads: [articles, daily_briefs, usage_events, signal_tracking, history_notes]
    writes: [history_notes]  # upsert/delete par iso

# Tables Supabase — ordre alphabétique
tables:
  - name: activity_briefs
    owner_pipeline: activity_brief_generator
    rls: authenticated
    domain: jarvis

  - name: anime_articles
    owner_pipeline: anime_sync
    rls: authenticated
    domain: veille

  - name: articles
    owner_pipeline: daily_digest
    rls: authenticated
    domain: veille

  - name: business_ideas
    owner_pipeline: front
    rls: authenticated
    domain: business

  - name: claude_veille
    owner_pipeline: cowork_external  # routine Cowork hebdo (skill schedule) — INSERT en service_role via MCP Supabase
    rls: authenticated  # SELECT + UPDATE pour authenticated, INSERT/DELETE réservés service_role
    domain: veille

  - name: claude_ecosystem
    owner_pipeline: cowork_external  # routine Cowork mensuelle "Catalogue écosystème" passe 1 + ajouts manuels front
    rls: authenticated  # SELECT + INSERT + UPDATE pour authenticated (le user peut ajouter une intégration manuellement)
    domain: veille

  - name: ai_landscape
    owner_pipeline: cowork_external  # routine Cowork mensuelle "Catalogue écosystème" passe 2 (panorama marché) — ADR-51
    rls: authenticated  # SELECT + INSERT + UPDATE pour authenticated
    domain: veille

  - name: challenge_attempts
    owner_pipeline: front
    rls: authenticated
    domain: apprentissage

  - name: commitments
    owner_pipeline: front
    rls: authenticated
    domain: personnel

  - name: daily_briefs
    owner_pipeline: daily_digest
    rls: authenticated
    domain: veille

  - name: daily_mirror
    owner_pipeline: cowork_external  # routine Cowork quotidienne 19h "Miroir du soir cockpit" — UPSERT en service_role via MCP
    rls: authenticated  # SELECT pour authenticated, INSERT/UPDATE réservés service_role
    domain: telemetry

  - name: entities
    owner_pipeline: jarvis_nightly_learner
    rls: authenticated
    domain: jarvis

  - name: game_franchises
    owner_pipeline: igdb_tracker_sync
    rls: authenticated
    domain: gaming

  - name: game_progress
    owner_pipeline: front
    rls: authenticated
    domain: gaming
    notes: >
      User-owned : aucun pipeline n'y écrit sauf igdb_tracker_sync::import_wishlist()
      (one-shot Task 6, en ignore_dupes — n'écrase jamais un statut posé par
      l'utilisateur). Le lot 2 y branchera le front (statuts wishlist/playing/
      finished/dropped).

  - name: game_releases
    owner_pipeline: igdb_tracker_sync
    rls: authenticated
    domain: gaming

  - name: game_titles
    owner_pipeline: igdb_tracker_sync
    rls: authenticated
    domain: gaming

  - name: gaming_articles
    owner_pipeline: gaming_sync
    rls: authenticated
    domain: veille

  - name: gaming_stats_daily
    owner_pipeline: steam_sync
    rls: authenticated
    domain: gaming

  - name: gaming_wishlist
    owner_pipeline: front
    rls: authenticated
    domain: gaming

  - name: gemini_api_calls
    owner_pipeline: daily_digest
    rls: authenticated
    domain: telemetry

  - name: history_notes
    owner_pipeline: front
    rls: authenticated
    domain: personnel

  - name: jarvis_conversations
    owner_pipeline: jarvis_api
    rls: authenticated
    domain: jarvis

  - name: jarvis_status_snapshot
    owner_pipeline: jarvis_status_generator
    rls: authenticated
    domain: jarvis

  - name: market_skill_gap
    owner_pipeline: none  # VUE SQL (sql/031_market_skill_gap.sql), dérivée de jobs.intel — aucun pipeline ne l'écrit
    rls: authenticated  # vue en security_invoker : la RLS de `jobs` s'applique à l'appelant
    domain: business

  - name: job_scans
    owner_pipeline: jobs_radar_routine  # routine Claude Code distante (claude.ai, cron 4×/sem) via MCP Supabase — ADR-19 (ex-cowork_external)
    rls: public  # using(true) — pas aligné sur 006_rls_authenticated
    domain: business

  - name: jobs
    owner_pipeline: jobs_radar_routine  # routine Claude Code distante (JSearch + Sonnet 4.6 + MCP Supabase) — ADR-19, remplace la routine Cowork LinkedIn
    rls: public  # using(true), update whitelist status + user_notes + user_verdict* + closed_at
    domain: business
    columns_notable:
      - name: intel
        type: jsonb
        writer: jobs_radar_routine  # { salary_estimate, skills_required:[{name,on_cv}], skills_source, employer_logo } ; intel_depth='light'. Intel warm + cv_recommended/cv_reason abandonnés — ADR-19/20
        reader: front  # carte fiche éditoriale : skills have/gap (+ source) + encart salaire + logo
      - name: is_remote
        type: boolean
        writer: jobs_radar_routine  # = JSearch job_is_remote ; NULL = inconnu (migration 016, ADR-20)
        reader: front  # badge « Remote » + filtre — lecture seule, hors whitelist PATCH
      - name: closed_at
        type: timestamptz
        writer: front  # bouton cockpit "Marquer clôturée"/"Rouvrir" (réversible) — ADR-18. Détection auto abandonnée avec la migration JSearch (plus de navigateur) — ADR-19. JSearch n'expose AUCUN champ d'expiration (vérifié 2026-07-29) : c'est la seule source de vérité sur la clôture, d'où son héritage sans péremption par le trigger — ADR-32
        reader: front  # masquage feed + filtre Clôturées (migration 015) ; + trigger jobs_inherit_user_status (hérite closed_at sur republication — ADR-32 ; depuis sql/035, hérite aussi sans péremption les statuts de candidature applied / interview / rejected / ghosted — ADR-52)
      - name: logical_key
        type: text  # GENERATED ALWAYS AS jobs_logical_key(company, title) STORED, indexé (migration 026)
        writer: postgres  # colonne GÉNÉRÉE — aucun writer applicatif ; un INSERT qui la vise échoue
        reader: jobs_radar_routine  # dédup ÉTAPE 2 sans fenêtre temporelle (le fenêtrage 45j faisait ressortir des annonces mortes) + trigger jobs_inherit_user_status — ADR-32. Source UNIQUE de la normalisation ADR-25 : ne jamais la réimplémenter côté modèle

  - name: learning_recommendations
    owner_pipeline: weekly_analysis
    rls: authenticated
    domain: apprentissage

  - name: media_entries
    owner_pipeline: anime_tracker_sync   # + tmdb_tracker_sync — chacun borné à sa propre `source`
    rls: authenticated
    domain: perso
    notes: >
      runtime_minutes (nullable, migration 022) = durée d'UN épisode ou du film,
      alimentée par les syncs. Consommée par pickTonight() pour filtrer sur le
      budget temps du soir. Une durée inconnue n'exclut jamais une entrée.

  - name: media_franchises
    owner_pipeline: front
    rls: authenticated
    domain: perso

  - name: media_progress
    owner_pipeline: front
    rls: authenticated
    domain: perso

  - name: media_releases
    owner_pipeline: anime_tracker_sync   # + tmdb_tracker_sync — événements dédupliqués par UNIQUE(entry_id,event_type), quelle que soit la source
    rls: authenticated
    domain: perso

  - name: memories_vectors
    owner_pipeline: jarvis_indexer
    rls: authenticated
    domain: jarvis

  - name: music_artist_tags
